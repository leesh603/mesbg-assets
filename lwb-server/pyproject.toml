[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lwb-server"
version = "0.1.0"
description = "LAST WAR BAND cloud save + leaderboard API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["app"]
