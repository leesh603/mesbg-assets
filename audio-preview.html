<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>미들어스 워밴드 — 새 음향 미리듣기</title>
<style>body{max-width:760px;margin:30px auto;padding:0 18px;background:#17221c;color:#ede5cd;font:16px/1.6 system-ui}h1{font:28px Georgia,serif;color:#d9c084}h2{font-size:21px}article{border-top:1px solid #536251;padding:16px 0}audio{width:100%}button{padding:9px 13px;margin:4px;border:1px solid #88754b;background:#283428;color:#f0dfb5;border-radius:4px;cursor:pointer}a{color:#dcc58f}.effects{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.effect{padding:8px;background:#243124}p{color:#c4cbb9}</style>
<h1>MIDDLE-EARTH WARBANDS</h1><p>새 관현악 BGM 7곡 · 녹음 기반 효과음 · 자동 8배속용 짧은 버전</p>
<p><a href="./">새 음향을 적용한 게임 열기</a></p>
<article><h2>전투 믹스 미리듣기</h2><p>처음 12초는 일반 속도, 이후는 고속용 효과음의 밀도를 보여주는 예시입니다. 음악 속도는 같습니다. 실제 게임 녹화 음성은 아닙니다.</p>
<audio controls preload="none" src="assets/mesbg/audio/remaster-demo.mp3" aria-label="일반 속도와 8배속용 전투 믹스"></audio></article>
<main id="music"></main><article><h2>효과음 비교</h2><p>일반용과 고속용을 각각 들어볼 수 있습니다.</p><audio id="effect-player" controls preload="none" aria-label="선택한 효과음"></audio><div class="effects" id="effects"></div></article>
<script>
const tracks=[['main','중간계의 황혼','메인 진입 화면 · 현악기와 호른, 비극과 희망'],['rohan','황금빛 초원의 기병','로한 전투 준비 · 북유럽 피들과 기병 리듬'],['gondor','백색 도시의 수호자','곤도르 전투 준비 · 금관과 남성 합창'],['mordor','검은 대지','모르도르 전투 준비 · 저음 합창과 어두운 행진'],['battle','검과 방패','일반 전투 · 절제된 현악기 리듬과 변주'],['heroes-bosses','최후의 전열','보스와 영웅 교전 · 위협과 영웅적 저항'],['aftermath','전쟁이 끝난 자리','전투 종료 · 현악기와 목관의 짧은 애가']];
for(const [id,title,description]of tracks){const article=document.createElement('article');article.innerHTML='<h2>'+title+'</h2><p>'+description+'</p><audio controls preload="none" aria-label="'+title+'" src="assets/mesbg/audio/ost/'+id+'.mp3"></audio><a download href="assets/mesbg/audio/ost/'+id+'.mp3">음원 파일</a>';document.getElementById('music').append(article);}
const sounds=[['dice_roll','주사위'],['sword_shield','방패 타격'],['sword_armor','갑옷 타격'],['sword_flesh','유효 타격'],['sword_swing','검 휘두름'],['sword_parry','검 맞부딪힘'],['critical_hit','강한 타격'],['axe_hit','도끼 타격'],['spear_thrust','창 찌르기'],['arrow_release','활 발사'],['arrow_impact','화살 명중'],['base_slide','이동'],['base_contact','돌격 접촉'],['death','전사'],['ui_select','선택'],['ui_confirm','확인'],['reward_select','보상'],['war_horn','공세 시작'],['cast','시전'],['heal','치유'],['terror','공포'],['monster_hit','괴수 타격']];
for(const [id,label]of sounds){const row=document.createElement('div');row.className='effect';row.append(document.createTextNode(label));for(const [fast,title]of [[false,'일반'],[true,'고속']]){const button=document.createElement('button');button.textContent=title;button.setAttribute('aria-label',label+' '+title);button.onclick=()=>{const player=document.getElementById('effect-player');player.src='assets/mesbg/audio/'+(fast?'fast/':'')+id+'.wav';player.play().catch(()=>{});};row.append(button);}document.getElementById('effects').append(row);}
document.addEventListener('play',event=>{if(event.target.tagName==='AUDIO')for(const audio of document.querySelectorAll('audio'))if(audio!==event.target)audio.pause();},true);
</script></html>
