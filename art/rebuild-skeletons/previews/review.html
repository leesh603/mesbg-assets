<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>표준 바디 · 10유닛 시험 검토</title><style>
*{box-sizing:border-box}body{margin:0;background:#18211d;color:#eadfc7;font:16px/1.65 system-ui,sans-serif}header{padding:22px 24px;background:#202c25;border-bottom:1px solid #6f775b}h1{font-size:24px;margin:0 0 8px}p{margin:6px 0;color:#bec9b6}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px;position:sticky;top:0;background:#18211df5}button{padding:12px 18px;font:inherit;border:1px solid #788168;border-radius:7px;background:#26372c;color:#eadfc7;cursor:pointer}button[aria-selected=true]{background:#c3aa70;color:#17221c}main{padding:0 18px 28px}figure{margin:0;overflow:auto;border:1px solid #465647;background:#202624}img{display:block;max-width:100%;height:auto;margin:auto}figcaption{padding:14px;color:#bec9b6}.hint{padding:0 24px 16px;font-size:14px}a{color:#dfc48a}
</style><header><h1>표준 바디 + 신규 10종 · 시험 검토</h1><p>정면에 가까운 약한 사선 · 위에서 20~30도 · 인간형 5등신 중심 · 첨부 세오덴 픽셀톤</p><p>운영 에셋 교체 없음 / main 병합·배포 없음</p></header>
<nav role="tablist"><button data-src="standard-bodies.png" aria-selected="true">표준 바디</button><button data-src="ten-units.png" aria-selected="false">신규 10종</button><button data-src="old-vs-new.png" aria-selected="false">기존 vs 신규</button><button data-src="terrain-placement.png" aria-selected="false">맵 배치</button></nav>
<p class="hint">같은 월드 배율을 사용합니다. 장식물 포함 외곽 크기로 유닛을 맞추지 않습니다. 맵 배치는 운영 지형 위 제작용 합성이며 실제 전투 적용 화면은 아닙니다.</p><main><figure><img id="plate" src="standard-bodies.png" alt="표준 바디 모음"><figcaption id="caption">표준 바디: 종족별 체형과 기마 결합 위치를 비교합니다.</figcaption></figure></main>
<script>const captions={'standard-bodies.png':'표준 바디: 종족별 체형과 기마 결합 위치를 비교합니다.','ten-units.png':'신규 10종: 바디 기반 복장·무장·문양을 얹은 시험용 유닛입니다.','old-vs-new.png':'기존/신규: 기준 main의 기존 프로필과 신규 수동 몸체 측정값으로 같은 월드 배율에 배치했습니다.','terrain-placement.png':'맵 배치: 운영 지형 원본 위 제작용 합성. 본게임 교체 및 실전 검증 전입니다.'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));const p=document.getElementById('plate');p.src=b.dataset.src;p.alt=b.textContent;document.getElementById('caption').textContent=captions[b.dataset.src]});</script></html>
