<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MESBG 인게임 크기 테스트</title><style>
@font-face{font-family:Pretendard;src:url("assets/mesbg/fonts/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}:root{color-scheme:dark;--bg:#10170f;--panel:#1b2419;--line:#5d593d;--gold:#d4b76f;--text:#ece7d4;--dim:#b2b59f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Pretendard,'Malgun Gothic',sans-serif}button,input,select{font:inherit;color:inherit;background:#263020;border:1px solid var(--line);border-radius:5px;min-height:40px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:disabled{opacity:.45;cursor:wait}button.primary{background:var(--gold);color:#191b10;font-weight:700}h1{margin:0;font-size:19px;color:#ecdb9b}h2{font-size:14px;color:var(--gold);margin:18px 0 8px}p{margin:6px 0;color:var(--dim)}header{padding:14px 18px;border-bottom:1px solid var(--line)}header a{color:var(--gold);float:right}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;padding:12px}.controls{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}label{display:block;margin:8px 0 4px}select,input[type=search]{width:100%}input[type=checkbox]{min-height:0;accent-color:var(--gold)}.checks{display:flex;gap:8px 15px;flex-wrap:wrap}.checks label{white-space:nowrap}.checks label input{margin-right:4px}.stage input{width:70px}.catalog{height:210px;overflow:auto;border:1px solid var(--line);border-radius:5px}.catalog button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:7px 9px;min-height:44px}.catalog button[aria-pressed=true]{background:#475337;color:#fff4cf}.catalog small{display:block;color:var(--dim);font-size:11px}.catalog button:hover{background:#34412b}.selected{color:#e9d99e;min-height:26px;margin-top:7px}.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:8px 8px 0 0}.toolbar select{width:auto;max-width:180px}.toolbar output{min-width:52px;text-align:center;color:var(--gold)}.toolbar button{font-size:12px;min-height:36px}.viewport{display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:#080d09;border:1px solid var(--line);height:680px;max-height:78svh}.viewport iframe{display:block;width:100%;height:100%;border:0;flex:none}.viewport.mobile iframe{width:390px;height:680px}.hint{font-size:12px;padding:8px;background:var(--panel);border:1px solid var(--line);border-top:0;color:var(--dim)}#status{color:var(--gold);font-size:12px}.roster{max-height:170px;overflow:auto}.roster .entry{display:flex;gap:4px;margin:4px 0}.entry button:first-child{flex:1;text-align:left;min-width:0;font-size:12px}.entry button:last-child{min-width:40px}#detail{font-size:12px;color:var(--dim);white-space:pre-line}.error{color:#ffb39c!important}.booting .controls button,.booting .toolbar button{pointer-events:none;opacity:.45}@media(max-width:850px){.layout{display:flex;flex-direction:column;padding:8px}.controls{order:2}.stagebox{order:1}.viewport{height:58svh;max-height:none}.viewport.mobile{height:680px;max-height:none}.catalog{height:180px}header{padding:10px}h1{font-size:16px}.toolbar{gap:4px}.toolbar select{width:auto;max-width:130px}.roster{max-height:150px}}
</style></head><body class="booting"><header><a href="gallery.html" target="_top">에셋 갤러리</a><h1>인게임 크기 테스트</h1><p>원하는 맵 위에 캐릭터를 소환하고 직접 나란히 비교하세요.</p><div id="status" role="status">게임 렌더러를 불러오는 중…</div></header>
<div class="layout"><aside class="controls"><label for="map">전장</label><select id="map"></select><div class="row stage"><label for="stage">진행 스테이지</label><input id="stage" type="number" min="1" max="100" value="1"><button id="apply-map">맵 적용</button></div><p id="map-phase"></p><h2>캐릭터 소환</h2><input id="search" type="search" placeholder="이름 / 영문 / ID 검색" aria-label="캐릭터 검색"><div class="row"><select id="side" aria-label="세력"><option value="">모든 세력</option><option value="good">자유민족</option><option value="evil">악의 세력</option></select><select id="kind" aria-label="유닛 유형"><option value="">모든 유형</option><option value="hero">영웅</option><option value="rider">기마 / 탑승</option><option value="monster">괴수</option><option value="dwarf">난쟁이</option><option value="hobbit">호빗</option></select></div><div id="catalog" class="catalog" aria-label="캐릭터 목록"></div><div id="chosen" class="selected">캐릭터를 선택하세요</div><div class="row"><input id="count" type="number" min="1" max="12" value="1" aria-label="소환 수" style="width:55px;flex:0 1 65px"><button id="spawn" class="primary">소환</button></div><h2>크기 비교</h2><div class="row"><button id="lineup">발끝 맞춰 정렬</button><button id="clear">전체 삭제</button></div><div class="checks"><label><input id="names" type="checkbox" checked>이름</label><label><input id="reference" type="checkbox">몸체 측정구간</label><label><input id="bases" type="checkbox" checked>발판</label><label><input id="animate" type="checkbox">대기 동작</label></div><div id="detail">캐릭터를 누르면 실제 표시 크기가 나옵니다.</div><h2>소환된 캐릭터 <span id="total">0</span></h2><div id="roster" class="roster"></div></aside>
<main class="stagebox"><div class="toolbar"><button id="game-view">인게임 보기</button><button id="one">1:1</button><button id="overview">맵 전체</button><button id="minus" aria-label="축소">−</button><output id="zoom">100%</output><button id="plus" aria-label="확대">+</button><select id="device" aria-label="화면 크기"><option value="desktop">현재 화면</option><option value="mobile">모바일 390×680</option></select><button id="png">PNG 저장</button></div><div id="viewport" class="viewport"><iframe id="frame" title="실제 게임 맵 및 유닛 크기 프리뷰" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe></div><div class="hint">캐릭터 드래그 = 위치 변경 · 빈 땅 드래그 = 화면 이동 · 휠 / 두 손가락 = 확대·축소<br>1:1 = 월드 1픽셀을 화면 1픽셀로 표시. 인게임 보기는 현재 화면에 맞는 게임 카메라 배율을 적용합니다.</div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),frame=$('frame');let api=null,chosen='',busy=false;
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function catalog(){if(!api)return;const term=$('search').value.trim().toLowerCase(),side=$('side').value,kind=$('kind').value;const list=api.catalog.filter(m=>(!side||m.side===side)&&(!term||(m.name+' '+m.english+' '+m.id).toLowerCase().includes(term))&&(!kind||kind==='rider'&&apiFrameProfile(m.id)?.[6]==='rider'||kind==='hero'&&m.role==='hero'||kind==='monster'&&m.role==='monster'||m.class===kind));$('catalog').replaceChildren();for(const m of list){const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(chosen===m.id));b.append(document.createTextNode(m.name));const small=document.createElement('small');small.textContent=m.id;b.append(small);b.onclick=()=>{chosen=m.id;$('chosen').textContent=m.name;catalog();};$('catalog').append(b);}if(!list.length)$('catalog').textContent='검색 결과가 없습니다.';}
function apiFrameProfile(id){return frame.contentWindow.MESBG?.unitArtProfiles[id];}
function refresh(){if(!api)return;const state=api.snapshot();$('zoom').value=Math.round(state.zoom*100)+'%';$('map-phase').textContent=state.phase;$('total').textContent=state.units.length;$('roster').replaceChildren();for(const u of state.units){const row=document.createElement('div');row.className='entry';const pick=document.createElement('button');pick.textContent=u.name;pick.onclick=()=>api.select(u.uid);if(u.uid===state.selected)pick.style.borderColor='#e8cc80';const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label',u.name+' 삭제');del.onclick=()=>api.remove(u.uid);row.append(pick,del);$('roster').append(row);}const u=state.units.find(u=>u.uid===state.selected);$('detail').textContent=u?u.name+'\n그림 전체 '+u.width.toFixed(1)+' × '+u.height.toFixed(1)+' 월드 px\n'+(u.mode==='rider'?'기수':'몸체')+' 기준 '+u.referenceSize+' px ('+(u.referenceAxis==='width'?'폭':'높이')+')':'캐릭터를 누르면 실제 표시 크기가 나옵니다.';}
function act(fn){try{fn();refresh();}catch(e){status(e.message,true);}}
$('apply-map').onclick=()=>act(()=>{const n=Math.max(1,Math.min(100,Number($('stage').value)||1));$('stage').value=n;api.setMap($('map').value,n);});
for(const id of ['search','side','kind'])$(id).addEventListener(id==='search'?'input':'change',catalog);
$('spawn').onclick=async()=>{if(!chosen){status('먼저 캐릭터를 선택하세요.');return;}if(busy)return;busy=true;$('spawn').disabled=true;status('캐릭터 이미지 로딩 중…');try{const n=Math.max(1,Math.min(12,Number($('count').value)||1));$('count').value=n;await api.spawn(chosen,n);refresh();status('소환 완료 · 캐릭터를 드래그해 배치하세요.');}catch(e){status(e.message,true);}finally{busy=false;$('spawn').disabled=false;}};
$('lineup').onclick=()=>act(()=>api.lineup());$('clear').onclick=()=>act(()=>api.clear());$('minus').onclick=()=>act(()=>api.zoom(api.snapshot().zoom-.1));$('plus').onclick=()=>act(()=>api.zoom(api.snapshot().zoom+.1));$('one').onclick=()=>act(()=>api.zoom(1));$('overview').onclick=()=>act(()=>api.overview());$('game-view').onclick=()=>act(()=>api.gameView());$('png').onclick=()=>act(()=>api.png());$('device').onchange=()=>{$('viewport').classList.toggle('mobile',$('device').value==='mobile');};for(const id of ['names','reference','bases','animate'])$(id).onchange=()=>act(()=>api.options(Object.fromEntries(['names','reference','bases','animate'].map(k=>[k,$(k).checked]))));
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='mesbg-preview-change')return;if(!api){api=frame.contentWindow.GalleryPreview;if(!api)return;for(const m of api.maps){const o=document.createElement('option');o.value=m.key;o.textContent=m.name;$('map').append(o);}document.body.classList.remove('booting');catalog();status('준비 완료 · 게임과 동일한 맵·몸체 크기 계산 사용');}refresh();});
(async()=>{try{
 const [game,runtime]=await Promise.all(['index.html','gallery-preview-runtime.js'].map(async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(url+' 로딩 실패 ('+r.status+')');return r.text();}));
 const marker='/*__LWB_SRC_END__*/';if(!game.includes(marker))throw Error('게임 소스 마커가 변경되었습니다. 프리뷰 연결을 확인해야 합니다.');
 const base=new URL('.',location.href).href;
 const boot='<base href="'+base+'"><script>const memoryStorage=()=>{const m=new Map();return {getItem:k=>m.get(String(k))??null,setItem:(k,v)=>m.set(String(k),String(v)),removeItem:k=>m.delete(String(k)),clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}};Object.defineProperty(window,"localStorage",{value:memoryStorage()});Object.defineProperty(window,"sessionStorage",{value:memoryStorage()});<\/script>';
 const css='<style>html body #app#app#app,html body #app#app#app .layout,html body #app#app#app .battle-column,html body #app#app#app .field,html body #app#app#app #game{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;max-width:none!important;display:block!important;padding:0!important;margin:0!important;border:0!important;transform:none!important}html body #app#app#app>*:not(.layout),html body #app#app#app .layout>*:not(.battle-column),html body #app#app#app .battle-column>*:not(.field),html body #app#app#app .field>*:not(#game),html body #game>*:not(canvas),html body>div:not(#app){display:none!important}html,body{overflow:hidden!important;background:#111!important}canvas{touch-action:none!important}</style>';
 const documentHTML=game.replace('<head>','<head>'+boot).replace(marker,()=>runtime+'\n'+marker);const bodyEnd=documentHTML.lastIndexOf('</body>');if(bodyEnd<0)throw Error('게임 문서의 끝을 찾지 못했습니다.');frame.srcdoc=documentHTML.slice(0,bodyEnd)+css+documentHTML.slice(bodyEnd);
 setTimeout(()=>{if(!api)status('게임 로딩이 지연되고 있습니다. 새로고침 후 다시 확인하세요.',true);},60000);
}catch(e){status(e.message,true);}})();
</script></body></html>
