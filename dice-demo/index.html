<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MESBG 주사위 데모</title>
<style>
  body{margin:0;background:#14161a;color:#e8e4d8;font-family:system-ui;overflow:hidden}
  #ui{position:fixed;top:12px;left:12px;z-index:10;display:flex;gap:8px;align-items:center;
      background:rgba(0,0,0,.5);padding:10px 14px;border-radius:10px;backdrop-filter:blur(4px)}
  select,button{font-size:14px;padding:6px 10px;border-radius:6px;border:1px solid #555;
                background:#23262c;color:#e8e4d8;cursor:pointer}
  button:hover{background:#33383f}
  #result{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
          font-size:20px;background:rgba(0,0,0,.55);padding:10px 20px;border-radius:10px;white-space:nowrap}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui">
  <select id="faction">
    <option value="minastirith">미나스 티리스</option>
    <option value="mordor">모르도르</option>
    <option value="isengard">아이센가드</option>
    <option value="rohan">로한</option>
    <option value="elf">엘프</option>
    <option value="dwarf">드워프</option>
    <option value="haradrim">하라드림</option>
  </select>
  <select id="count">
    <option>1</option><option selected>2</option><option>3</option><option>4</option><option>6</option>
  </select>
  <button id="roll">주사위 굴리기</button>
</div>
<div id="result">주사위를 굴려보세요 (스페이스)</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
  "cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as CANNON from 'cannon-es';

const FACE_DIR = { // BoxGeometry material order: +x,-x,+y,-y,+z,-z  (opposites sum to 7)
  px: 1, nx: 6, py: 2, ny: 5, pz: 3, nz: 4
};
const FACE_FILE = v => v === 6 ? 'emblem' : String(v);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('result').textContent = '이 브라우저에서는 WebGL을 사용할 수 없어요 (하드웨어 가속 필요)';
  throw e;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 18, 34);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 8.5, 7.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.45;
controls.minDistance = 5; controls.maxDistance = 20;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x30281e, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(6, 12, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -9;
sun.shadow.camera.right = sun.shadow.camera.top = 9;
scene.add(sun);

// physics world
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
const matGround = new CANNON.Material('ground');
const matDie = new CANNON.Material('die');
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matDie, { friction: 0.35, restitution: 0.28 }));
world.addContactMaterial(new CANNON.ContactMaterial(matDie, matDie, { friction: 0.1, restitution: 0.35 }));

// felt tray floor
const felt = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0x25332b, roughness: 0.95 })
);
felt.rotation.x = -Math.PI / 2; felt.receiveShadow = true;
scene.add(felt);
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(9, 0.35, 16, 100),
  new THREE.MeshStandardMaterial({ color: 0x4a3624, roughness: 0.8 })
);
rim.rotation.x = Math.PI / 2; rim.position.y = 0.32; rim.castShadow = rim.receiveShadow = true;
scene.add(rim);

const groundBody = new CANNON.Body({ type: CANNON.Body.STATIC, material: matGround, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);
// invisible circular wall
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2;
  const w = new CANNON.Body({ type: CANNON.Body.STATIC, material: matGround, shape: new CANNON.Box(new CANNON.Vec3(1.3, 2, 0.4)) });
  w.position.set(Math.cos(a) * 9.2, 1, Math.sin(a) * 9.2);
  w.quaternion.setFromEuler(0, -a + Math.PI / 2, 0);
  world.addBody(w);
}

const loader = new THREE.TextureLoader();
const texCache = new Map();
function faceMat(faction, value) {
  const key = `${faction}-${value}`;
  if (!texCache.has(key)) {
    const t = loader.load(`../dice-faces/${faction}-${FACE_FILE(value)}.png`);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    texCache.set(key, new THREE.MeshStandardMaterial({ map: t, roughness: 0.35, metalness: 0.15 }));
  }
  return texCache.get(key);
}
function materialsFor(faction) {
  return [1, 6, 2, 5, 3, 4].map(v => faceMat(faction, v));
}

const geo = new THREE.BoxGeometry(1, 1, 1);
const half = new CANNON.Vec3(0.5, 0.5, 0.5);
const dice = []; // {mesh, body, settled, value}
let settleTimer = null;

function clearDice() {
  for (const d of dice) { scene.remove(d.mesh); world.removeBody(d.body); }
  dice.length = 0;
}

function roll() {
  clearDice();
  const faction = document.getElementById('faction').value;
  const n = parseInt(document.getElementById('count').value, 10);
  document.getElementById('result').textContent = '굴리는 중...';
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(geo, materialsFor(faction));
    mesh.castShadow = mesh.receiveShadow = true;
    scene.add(mesh);
    const body = new CANNON.Body({ mass: 1, material: matDie, shape: new CANNON.Box(half), sleepSpeedLimit: 0.4, sleepTimeLimit: 0.5 });
    body.position.set(-6 + Math.random() * 2, 3.2 + i * 1.4, (Math.random() - 0.5) * 5);
    body.velocity.set(8 + Math.random() * 5, -1 + Math.random() * 2, (Math.random() - 0.5) * 7);
    body.angularVelocity.set((Math.random() - 0.5) * 24, (Math.random() - 0.5) * 24, (Math.random() - 0.5) * 24);
    world.addBody(body);
    dice.push({ mesh, body, settled: false, value: null });
  }
  clearTimeout(settleTimer);
}

const _up = new THREE.Vector3(0, 1, 0);
const _v = new THREE.Vector3();
function topValue(mesh) {
  // find which local axis is most aligned with world up
  let best = 0, label = 'py';
  for (const [axis, val] of Object.entries(FACE_DIR)) {
    _v.set(axis[1] === 'x' ? 1 : 0, axis[1] === 'y' ? 1 : 0, axis[1] === 'z' ? 1 : 0);
    if (axis[0] === 'n') _v.negate();
    _v.applyQuaternion(mesh.quaternion);
    if (_v.y > best) { best = _v.y; label = axis; }
  }
  return FACE_DIR[label];
}

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  world.step(1 / 60, dt, 3);
  let allSettled = dice.length > 0;
  for (const d of dice) {
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
    if (d.body.sleepState !== CANNON.Body.SLEEPING) allSettled = false;
  }
  if (allSettled && !settleTimer) {
    settleTimer = setTimeout(() => {
      const vals = dice.map(d => topValue(d.mesh));
      const total = vals.reduce((a, b) => a + b, 0);
      document.getElementById('result').textContent =
        vals.map(v => v === 6 ? '문양(6)' : v).join(' + ') + (vals.length > 1 ? `  =  ${total}` : '');
    }, 300);
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

document.getElementById('roll').addEventListener('click', roll);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); roll(); } });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
roll();
</script>
</body>
</html>
