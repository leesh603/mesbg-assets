name: Isolated mobile gameplay audit
on:
  push:
    branches: [qa/mobile-clear-audit-20261012]
    paths:
      - '.github/workflows/mobile-clear-audit.yml'
      - 'tools/mobile-clear-audit/**'
permissions:
  contents: read
concurrency:
  group: mesbg-isolated-mobile-audit
  cancel-in-progress: true
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tools/
            /tests/
            /lwb-worker/
            /index.html
            /EDITING.md
            /README.md
      - name: Prepare isolated browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inspect live mobile entry without account or server writes
        run: |
          mkdir -p audit-output/source
          cp -r src tools lwb-worker audit-output/source/ 2>/dev/null || true
          cp index.html EDITING.md README.md audit-output/source/ 2>/dev/null || true
          git rev-parse HEAD > audit-output/checked-out-sha.txt
          python - <<'PY'
          import asyncio,json,pathlib,traceback
          from playwright.async_api import async_playwright
          OUT=pathlib.Path('audit-output')
          async def main():
            async with async_playwright() as pw:
              browser=await pw.chromium.launch(headless=True,args=['--no-sandbox'])
              ctx=await browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True,locale='ko-KR')
              errors=[]; failed=[]; rejected=[]
              async def safe_route(route):
                req=route.request
                if req.method not in ['GET','HEAD','OPTIONS']:
                  rejected.append({'url':req.url,'method':req.method})
                  await route.abort()
                else: await route.continue_()
              await ctx.route('**/*',safe_route)
              page=await ctx.new_page()
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.on('requestfailed',lambda r:failed.append({'url':r.url,'failure':r.failure}))
              try:
                response=await page.goto('https://leesh603.github.io/mesbg-assets/',wait_until='domcontentloaded',timeout=120000)
                await page.wait_for_timeout(15000)
                await page.screenshot(path=str(OUT/'01-entry-mobile.png'),full_page=True)
                data=await page.evaluate('''() => ({title:document.title,text:document.body.innerText,viewport:{width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight},controls:[...document.querySelectorAll('button,input,select,a,[role="button"]')].map(e=>({tag:e.tagName,id:e.id,text:e.innerText,value:e.value,action:e.getAttribute('data-action'),onclick:e.getAttribute('onclick'),visible:!!(e.offsetWidth||e.offsetHeight)})),mesbg:window.MESBG?{keys:Object.keys(MESBG),battleKeys:MESBG.battle?Object.keys(MESBG.battle):[],phase:MESBG.battle?.phase}:null})''')
                data['status']=response.status if response else None
                (OUT/'entry.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
                print('ENTRY',json.dumps(data,ensure_ascii=False))
                await page.context.storage_state(path=str(OUT/'storage.json'))
              except Exception as e:
                errors.append(traceback.format_exc())
                try: await page.screenshot(path=str(OUT/'failure.png'),full_page=True)
                except Exception: pass
              finally:
                result={'errors':errors,'failedRequests':failed,'blockedWrites':rejected,'completePlaythrough':False}
                (OUT/'runtime.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
                print('RUNTIME',json.dumps(result,ensure_ascii=False))
                await browser.close()
          asyncio.run(main())
          PY
      - name: Upload observations and exact source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesbg-mobile-audit
          path: audit-output/
          retention-days: 7
