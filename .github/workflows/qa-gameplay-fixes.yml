name: Gameplay fix verification
on:
  push:
    branches: [fix/qa-gameplay-20261012]
    paths: [.github/workflows/qa-gameplay-fixes.yml]
permissions:
  contents: write
concurrency:
  group: gameplay-fixes-20261012
  cancel-in-progress: false
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MESBG_BASE_REF: bc1f3ed6512174eef78eeed1fd310a01eb9f21eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          sparse-checkout: |
            src
            tools
            tests
            lwb-worker
            assets/mesbg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge reviewed concurrent main changes without replacing game fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/qa-gameplay-20261012'
          mkdir -p qa-results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=20 origin "$MESBG_BASE_REF"
          git merge --no-ff --no-commit "$MESBG_BASE_REF" || true
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args]).decode()
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          assert set(conflicts) <= {'index.html','src/game.js'}, 'Unexpected conflict: '+repr(conflicts)
          base=git('merge-base','HEAD',os.environ['MESBG_BASE_REF']).strip()
          # main already contained a top-of-document diff3 conflict before this
          # repair. Normalize THAT historical conflict consistently on all three
          # inputs, then use a real three-way merge; never choose an entire side.
          def normalize(text):
              if not text.startswith('<<<<<<< HEAD\n'): return text
              pattern=r'^<<<<<<< HEAD\n(.*?)^\|{7} [^\n]*\n.*?^={7}\n.*?^>{7} [^\n]*\n'
              fixed,n=re.subn(pattern,lambda m:m[1],text,count=1,flags=re.S|re.M)
              assert n==1, 'Unrecognized historical merge conflict'
              return fixed
          for path in conflicts:
              names=[]
              for label,ref in [('ours','HEAD'),('base',base),('theirs',os.environ['MESBG_BASE_REF'])]:
                  text=git('show',ref+':'+path)
                  if path=='index.html': text=normalize(text)
                  temp=Path('qa-results')/(Path(path).name+'.'+label)
                  temp.write_text(text);names.append(str(temp))
              merged=subprocess.run(['git','merge-file','-p',*names],capture_output=True,text=True)
              assert merged.returncode==0, 'Needs manual conflict review: '+path
              Path(path).write_text(merged.stdout)
              subprocess.check_call(['git','add',path])
          html=Path('index.html').read_text();src=Path('src/game.js').read_text()
          begin='/*__LWB_SRC_BEGIN__*/';end='/*__LWB_SRC_END__*/'
          a=html.index(begin)+len(begin);b=html.index(end)
          Path('index.html').write_text(html[:a]+'\n'+src.strip()+'\n'+html[b:])
          subprocess.check_call(['git','add','index.html','src/game.js'])
          assert not git('diff','--name-only','--diff-filter=U').strip()
          PY
      - name: Verify merged game with the latest original assets
        shell: bash
        run: |
          set -euo pipefail
          node --check src/game.js
          node --check lwb-worker/src/index.js
          node --test tests/*.test.cjs 2>&1 | tee qa-results/repository-tests.log
          git diff --cached --check
          git diff --cached --stat | tee qa-results/diff-stat.txt
      - name: Commit tested integration to this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/qa-gameplay-20261012'
          if ! git diff --cached --quiet || [ -f .git/MERGE_HEAD ]; then
            git commit -m 'merge: preserve latest art updates with verified campaign repairs'
            git push origin HEAD:refs/heads/fix/qa-gameplay-20261012
          fi
          git rev-parse HEAD | tee qa-results/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-integrated-results
          path: qa-results/
          retention-days: 7
