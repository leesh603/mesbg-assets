name: Isolated integrated rework review
on:
  push:
    branches: [codex/mesbg-integrated-rework-20261013]
    paths: ['src/**', 'index.html', 'tests/rework-browser.cjs', '.github/workflows/integrated-review.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /src/
            /tests/
            /tools/build.js
            /icons/eq_guthwine.png
            /icons/eq_lorien_bow.png
            /index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/integrated-rework.test.cjs
      - run: node tests/rework-browser.cjs
        env:
          BASE_SHA: 5662b66fae3fd996193ef565b84ec6118750fc5e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-review-${{ github.sha }}
          path: review-output/
          retention-days: 14
