<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중간계 워밴드 — 최종 적용본</title><style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#111a15;color:#e4e8d8}*{box-sizing:border-box}body{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0}p{color:#aebdac}a{color:#e5cc83}header{border-bottom:1px solid #425341;padding-bottom:18px}nav,.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,input,select{font:inherit;border:1px solid #51634c;background:#223024;color:inherit;border-radius:6px;padding:9px 12px}button{cursor:pointer}button.active{background:#d1b469;color:#182016}input{flex:1;min-width:180px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}article{padding:14px;border:1px solid #354734;border-radius:8px;background:#1a271d;min-width:0}h2{font-size:16px;margin:0}small{color:#a2b29d;overflow-wrap:anywhere}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pair figure{margin:0;background:#263528;border-radius:6px;text-align:center}.pair img{width:100%;height:175px;object-fit:contain;image-rendering:pixelated;padding:7px}figcaption{font-size:12px;color:#b8c7ad;padding-bottom:6px}.capture{width:100%;height:auto;display:block;border-radius:4px;margin-top:12px}.wide{grid-column:1/-1}.map-card{grid-column:span 2}.map-card img{width:100%}#more{display:block;margin:22px auto;min-width:200px}footer{margin-top:30px;border-top:1px solid #354734;padding-top:18px;color:#98ad95;font-size:13px}@media(max-width:620px){body{padding:16px}.map-card{grid-column:auto}h1{font-size:22px}}
</style><header><h1>중간계 워밴드 · 최종 적용본</h1><p>캐릭터 510종 · 지역 27개 · 2026.10.21</p><a href="../../">게임 실행 →</a> · <a href="../../gallery.html">에셋 갤러리</a></header><nav><button class="active" data-tab="units">캐릭터 비교</button><button data-tab="maps">지역별 맵</button><button data-tab="engine">실제 전장 화면</button></nav><div class="filters"><input id="search" placeholder="캐릭터 이름 또는 ID 검색" aria-label="캐릭터 검색"><select id="kind" aria-label="분류"><option value="">전체</option><option value="rider">기마·탑승</option><option value="body">도보·괴수</option></select></div><p id="count" aria-live="polite"></p><main id="grid"></main><button id="more">더 보기</button><footer>캐릭터 그림·썸네일·표시 크기와 지역별 지형을 함께 반영했습니다. 실제 엔진에서 캐릭터 510종 로딩과 27개 맵의 전황 5단계, 모바일 메뉴 배치를 검사했습니다. 화면은 검증용 배치이며 실제 휴대폰의 성능 측정 자료는 아닙니다.</footer><script>
'use strict';let units=[],tab='units',limit=48;const $=id=>document.getElementById(id),maps=['minas_tirith','osgiliath','amon_sul','helms_deep','fangorn','edoras','moria','isengard','black_gate','gorgoroth','rivendell','lothlorien','pelennor','dead_marshes','dunharrow','erebor','mirkwood','dol_guldur','gondolin','angband','minas_court','orthanc','barad_dur','minas_morgul','dale','hornburg','erebor_hall'],names=['미나스 티리스','오스길리아스','웨더톱','헬름 협곡','팡고른','에도라스','모리아','아이센가드','검은 문','고르고로스','리븐델','로스로리엔','펠렌노르','죽음늪','던해로','에레보르','어둠숲','돌 굴두르','곤돌린','앙그반드','백색나무 안뜰','오르상크','바랏두르','미나스 모르굴','데일','혼부르크','에레보르 왕의 전당'];
function el(tag,text,cl){const e=document.createElement(tag);if(text)e.textContent=text;if(cl)e.className=cl;return e;}function image(src,alt,cl){const e=el('img');e.src=src;e.alt=alt;e.loading='lazy';if(cl)e.className=cl;return e;}
function draw(){const grid=$('grid');grid.replaceChildren();document.querySelector('.filters').hidden=tab!=='units';$('more').hidden=true;if(tab==='units'){const q=$('search').value.toLowerCase(),kind=$('kind').value,list=units.filter(u=>(!kind||u.profile[6]===kind)&&(u.name+' '+u.id).toLowerCase().includes(q));$('count').textContent=list.length+'종 중 '+Math.min(limit,list.length)+'종 표시';for(const u of list.slice(0,limit)){const card=el('article');card.append(el('h2',u.name),el('small',u.id));const pair=el('div',null,'pair');for(const [src,label]of [['before/'+u.id+'.png','기존'],['../../assets/mesbg/'+u.file+'?v=final-art-20261021','적용본']]){const fig=el('figure');fig.append(image(src,u.name+' '+label),el('figcaption',label));pair.append(fig);}card.append(pair);grid.append(card);}$('more').hidden=limit>=list.length;}else if(tab==='maps'){$('count').textContent='지역 27개 · 각 지역의 전황 1단계 화면';maps.forEach((key,i)=>{const c=el('article',null,'map-card');c.append(el('h2',names[i]),image('map-'+key+'.webp',names[i]+' 실제 게임 화면','capture'));grid.append(c);});}else{$('count').textContent='게임 엔진에서 렌더링한 전체 캐릭터 22개 비교 화면';for(let i=0;i<22;i++){const c=el('article',null,'wide');c.append(el('h2','전장 비교 '+(i+1)),image('units-'+String(i).padStart(2,'0')+'.webp','캐릭터 전장 비교 '+(i+1),'capture'));grid.append(c);}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));draw();});$('search').oninput=$('kind').onchange=()=>{limit=48;draw();};$('more').onclick=()=>{limit+=48;draw();};fetch('unit-manifest.json').then(r=>{if(!r.ok)throw Error('자료를 불러오지 못했습니다');return r.json();}).then(d=>{units=d.units.sort((a,b)=>a.name.localeCompare(b.name,'ko'));draw();}).catch(e=>$('count').textContent=e.message);
</script></html>
