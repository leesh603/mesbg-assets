<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유닛 5등신·쿼터뷰 교정 비교</title><style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#161d24;color:#e9e5db}body{margin:0 auto;max-width:1320px;padding:24px}h1{font-size:24px;color:#eed19a}h2{font-size:18px}p{max-width:900px}a{color:#edd1a0}nav{display:flex;gap:12px;flex-wrap:wrap}input,select{font:inherit;min-height:44px;box-sizing:border-box;background:#26313c;color:inherit;border:1px solid #667078;border-radius:6px;padding:8px}input{width:min(360px,100%)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px}article{border:1px solid #46505b;border-radius:10px;background:#202a34;padding:14px}article[hidden]{display:none}article h2{margin:0}.pair{display:flex;gap:8px}.pair figure{width:50%;margin:0;text-align:center}.pair img{height:190px;max-width:100%;object-fit:contain;image-rendering:auto}.pair figcaption{color:#c2b9a4}.refs{display:flex;gap:20px}.refs img{height:170px;max-width:45%;object-fit:contain}.screen{width:100%;height:auto}.meta{font-size:13px;color:#c3c8cd}details{margin:16px 0}summary{min-height:44px;cursor:pointer}@media(max-width:480px){body{padding:16px}.grid{grid-template-columns:1fr}.pair img{height:170px}}
</style></head><body><h1>유닛 비율·쿼터뷰 교정</h1><p>기존 글로르핀델 도보·기마를 기준으로 인간·엘프와 기수를 약 5등신으로 교정했습니다. 머리·몸통·다리 비율은 원화에서 수정하고, 게임 크기와 중심은 무기·깃발·장식을 제외한 신체 기준점으로 개별 고정했습니다.</p><p>61종 재작화, 길갈라드 지정 첨부본 적용, 난쟁이·고블린 10종 기존 체형 유지. 더 최근 지정한 에레스토르 첨부본도 보존했습니다.</p><div class="refs"><img src="../../tokens/glorfindel_foot.png" alt="변경하지 않은 글로르핀델 도보 기준"><img src="../../tokens/glorfindel_mounted.png" alt="변경하지 않은 글로르핀델 기마 기준"></div><p><a href="../../gallery.html">에셋 갤러리</a> · <a href="../../">게임</a> · <a href="manifest.json">개별 측정표</a></p><details><summary>실제 게임 엔진에서 같은 배율로 비교한 화면</summary><div id="screens"></div></details><nav><input id="query" type="search" placeholder="이름 / ID 검색" aria-label="유닛 검색"><select id="issue" aria-label="종류"><option value="">전체</option><option value="mounted">기마</option><option value="proportion">도보</option><option value="user-selected">지정 첨부본</option></select><span id="count" aria-live="polite"></span></nav><main id="units" class="grid"></main><script>
fetch('manifest.json').then(r=>r.json()).then(m=>{const root=document.getElementById('units');for(const u of m.units){const a=document.createElement('article');a.dataset.search=(u.name+' '+u.id).toLowerCase();a.dataset.issue=u.issue;const h=document.createElement('h2');h.textContent=u.name;a.append(h);const p=document.createElement('p');p.className='meta';p.textContent=u.id+' · 신체 기준 '+u.artProfile[5]+'px';a.append(p);const pair=document.createElement('div');pair.className='pair';for(const [title,path]of [['교정 전',u.files.before],['적용본',u.files.production]]){const f=document.createElement('figure'),img=document.createElement('img'),c=document.createElement('figcaption');img.src='../../'+path+'?v='+m.revision;img.alt=u.name+' '+title;img.loading='lazy';c.textContent=title;f.append(img,c);pair.append(f)}a.append(pair);root.append(a)}function filter(){const q=document.getElementById('query').value.trim().toLowerCase(),type=document.getElementById('issue').value;let n=0;for(const a of root.children){a.hidden=!a.dataset.search.includes(q)||(type&&a.dataset.issue!==type);if(!a.hidden)n++}document.getElementById('count').textContent=n+' / '+m.units.length+'종'}document.getElementById('query').addEventListener('input',filter);document.getElementById('issue').addEventListener('change',filter);filter();const screens=document.getElementById('screens');for(let i=0;i<Math.ceil(m.units.length/6);i++){const img=document.createElement('img');img.src='after-'+i+'.jpg';img.alt='글로르핀델과 동일 배율의 실제 게임 비교 '+(i+1);img.loading='lazy';img.className='screen';screens.append(img)}});
</script></body></html>
